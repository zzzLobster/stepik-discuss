services:
  caddy:
    # Pinned 2026-09-21 via `docker buildx imagetools inspect caddy:2.11.4-alpine`. Never use :latest.
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    ports:
      - "${CADDY_BIND_IP:-0.0.0.0}:80:80"
      - "${CADDY_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      CADDY_GATE_TOKEN: ${CADDY_GATE_TOKEN}
    healthcheck:
      # Hits the dedicated http://localhost:8081 site (see Caddyfile) — the
      # main site 308-redirects HTTP->HTTPS and has no cert for "localhost".
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - gate
      - remark42
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  gate:
    build:
      context: ..
      dockerfile: gate/Dockerfile
    restart: unless-stopped
    environment:
      STEPIK_CLIENT_ID: ${STEPIK_CLIENT_ID:-placeholder}
      STEPIK_CLIENT_SECRET: ${STEPIK_CLIENT_SECRET}
      STEPIK_REDIRECT_URL: ${STEPIK_REDIRECT_URL:-https://stepik.study67.fyi/auth/callback}
      TEACHER_ID: ${TEACHER_ID:-1182644732}
      GATE_TOKEN_KEY: ${GATE_TOKEN_KEY}
      REMARK_JWT_SECRET: ${REMARK_JWT_SECRET}
      CADDY_GATE_TOKEN: ${CADDY_GATE_TOKEN}
      GATE_VERIFY_TTL: ${GATE_VERIFY_TTL:-6h}
      GATE_RETRY_AFTER: ${GATE_RETRY_AFTER:-15m}
      GATE_MAX_STALE: ${GATE_MAX_STALE:-48h}
      SITE: ${SITE:-stepik-discuss}
      REMARK_URL: ${REMARK_URL:-https://stepik.study67.fyi/discuss}
    volumes:
      - gate-data:/data
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  remark42:
    # Pinned 2026-09-17 via `docker buildx imagetools inspect ghcr.io/umputun/remark42:v1.16.4`. Never use :latest.
    image: ghcr.io/umputun/remark42:v1.16.4@sha256:980e0e76a6f241cd181f44c5b4d686f0d8cd7f552e11deb3bdcba223b2c3b866
    restart: unless-stopped
    environment:
      SECRET: ${REMARK_JWT_SECRET}
      SITE: ${SITE:-stepik-discuss}
      REMARK_URL: ${REMARK_URL:-https://stepik.study67.fyi/discuss}
      AUTH_ANON: "false"
      # Single-sourced from TEACHER_ID (gate AdminSharedID is stepik_<TEACHER_ID>);
      # explicit ADMIN_SHARED_ID still wins when set.
      ADMIN_SHARED_ID: ${ADMIN_SHARED_ID:-stepik_${TEACHER_ID:-1182644732}}
      AUTH_TTL_JWT: 5m
      AVATAR_PROXY: "true"
      MAX_COMMENT_SIZE: "2000"
      EDIT_TIME: 10m
      # Placeholder custom provider "stepik" (D0-verified 2026-09-17, see plan §6.1):
      # go-pkgz/auth rejects ALL JWT when zero providers enabled
      # ("provider is not allowed"). Dummy cid/csec (non-secrets): login via
      # remark42 can never complete; all identity comes from Gate-minted JWT.
      AUTH_CUSTOM_NAME: stepik
      AUTH_CUSTOM_CID: ${AUTH_CUSTOM_CID:-spike-placeholder-never-completes}
      AUTH_CUSTOM_CSEC: ${AUTH_CUSTOM_CSEC:-spike-placeholder-never-completes}
      AUTH_CUSTOM_AUTH_URL: https://stepik.org/oauth2/authorize/
      AUTH_CUSTOM_TOKEN_URL: https://stepik.org/oauth2/token/
      AUTH_CUSTOM_INFO_URL: https://stepik.org/api/users/1182644732
      # Internal docker network only (behind Caddy forward_auth + Gate JWT).
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.16.0.0/12}
    volumes:
      - remark-data:/srv/var
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  gate-data:
  remark-data:
  caddy-data:

networks:
  app:
    driver: bridge
