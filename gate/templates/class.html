<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} — Обсуждения</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#3776AB">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stepik Discuss">
<script src="/static/push.js" defer></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
</head>
<body data-cid="{{.CID}}" data-uid="{{.UID}}" data-allowed='{{.AllowedJSON}}'>
<main>
<p><a href="/">← Все классы</a> · {{.FIO}} · <button type="button" class="button" data-refresh>↻ Обновить</button></p>
<h1>{{.Title}}</h1>
<p><a href="{{.StepikURL}}">Открыть класс на Stepik</a></p>
<p><button type="button" data-bell>🔔 Уведомлять о новых комментариях [Выкл]</button></p>
<p data-push-status></p>
<p data-ios-hint style="display:none"></p>
<div id="remark42"></div>
<script>
var remark_config = {
  host: "{{.EmbedHost}}",
  site_id: "{{.SiteID}}",
  url: "{{.PageURL}}",
  locale: 'ru',
  no_footer: true,
  show_rss_subscription: false,
  components: ['embed', 'last-comments', 'counter']
};
</script>
<script src="{{.EmbedHost}}/web/embed.js" defer></script>
<noscript>Для обсуждений нужен включённый JavaScript.</noscript>
</main>
</body>
</html>
