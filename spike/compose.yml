# spike-local only: no resource limits or log rotation by design.
# Never reuse this file for VPS deploy; see deploy/compose.yml.
services:
  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - remark42
    networks:
      - app

  remark42:
    image: ghcr.io/umputun/remark42:v1.16.4@sha256:980e0e76a6f241cd181f44c5b4d686f0d8cd7f552e11deb3bdcba223b2c3b866
    environment:
      SECRET: ${REMARK_JWT_SECRET:-spike-local-secret-spike-local-secret}
      SITE: stepik-discuss
      REMARK_URL: http://127.0.0.1:8080/discuss
      AUTH_ANON: "false"
      ADMIN_SHARED_ID: stepik_1182644732
      AUTH_TTL_JWT: 5m
      AVATAR_PROXY: "true"
      MAX_COMMENT_SIZE: "2000"
      EDIT_TIME: 10m
      DEBUG: "true"
      # Placeholder custom provider "stepik": satisfies go-pkgz/auth provider
      # allowlist so Gate-minted stepik_<id> JWTs verify (spike 2026-09-17:
      # zero providers => "provider is not allowed" for ALL tokens).
      # Login via remark42 can NEVER complete (dummy client id/secret);
      # all identity comes from Gate-minted JWT only.
      AUTH_CUSTOM_NAME: stepik
      AUTH_CUSTOM_CID: spike-placeholder-never-completes
      AUTH_CUSTOM_CSEC: spike-placeholder-never-completes
      AUTH_CUSTOM_AUTH_URL: https://stepik.org/oauth2/authorize/
      AUTH_CUSTOM_TOKEN_URL: https://stepik.org/oauth2/token/
      AUTH_CUSTOM_INFO_URL: https://stepik.org/api/users/1182644732
    volumes:
      - remark-data:/srv/var
    networks:
      - app

volumes:
  remark-data:

networks:
  app:
    driver: bridge
